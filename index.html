<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amortizar App</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🏠 Amortizar App</h1>

<!-- RESUMO -->

<div id="abaResumo">

<div class="card">
<p id="percentualMeta">0%</p>
<hr>

<h3>📈 Evolução dos Gastos</h3>

<canvas id="graficoGastos"></canvas>

</div>
</div>
  
<!-- GASTOS -->

<div id="abaGastos" style="display:none;">

<div class="card">

<h2>Financiamento</h2>

<input
id="saldo"
type="number"
  placeholder="Saldo Devedor Atual"
readonly>
<input
id="amortizacao"
type="number"
placeholder="Valor da Amortização">

<button onclick="amortizar()">
Registrar Amortização
</button>

<button onclick="reiniciarFinanciamento()">
🔄 Reiniciar Financiamento
</button>

</div>

  <div class="card">

<h2>Histórico de Amortizações</h2>

<div id="historicoAmortizacoes">
Nenhuma amortização registrada.
</div>

  </div>
<h2>Registrar Gasto</h2>

<select id="categoria">

<option value="">Selecione uma categoria</option>

<option>🍔 Alimentação</option>
<option>🛒 Mercado</option>
<option>🍺 Lazer</option>
<option>👕 Roupas</option>
<option>💊 Saúde</option>
<option>🚕 Transporte</option>
<option>🏠 Casa</option>
<option>🐶 Pets</option>
<option>🎁 Presentes</option>
<option>✈️ Viagem</option>
<option>📚 Educação</option>
<option>📱 Assinaturas</option>
<option>📦 Compras</option>
<option>📋 Outros</option>

</select>

<input
id="valorGasto"
type="number"
placeholder="Valor">

<input
id="observacao"
type="text"
placeholder="Observação">

<button onclick="registrarGasto()">
Salvar Gasto
</button>
  
<p id="mensagemSucesso"
style="display:none;
color:green;
font-weight:bold;
margin-top:10px;">

✅ Gasto salvo com sucesso!

</p>
  
</div>

</div>

<!-- HISTÓRICO -->

<div id="abaHistorico" style="display:none;">

<div class="card">

<h2 id="tituloHistorico">
Histórico de Gastos (0)
</h2>

<div id="listaGastos">
Nenhum gasto registrado.
</div>

</div>

</div>

</div>

<div class="menuInferior">

<button onclick="mostrarAba('resumo')">
🏠<br>Resumo
</button>

<button onclick="mostrarAba('gastos')">
💸<br>Gastos
</button>

<button onclick="mostrarAba('historico')">
📋<br>Histórico
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
